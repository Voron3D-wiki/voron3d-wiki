name: Affiliate Links + Protected High-Level Changes

# SECURITY NOTE
# This workflow runs on `pull_request_target`, so it executes with the base
# repository's secrets and a write-capable token, and a fork PR can trigger it.
# Therefore:
#   * The scripts and the CODEOWNERS allowlist are ALWAYS taken from the base
#     checkout (./base) - never from the PR.
#   * The PR is checked out into ./pr as DATA ONLY. Nothing in ./pr is executed,
#     sourced, or installed. Do not add a build/install/test step that runs code
#     from ./pr to this workflow - put that in a `pull_request` workflow instead.
#   * Both checkouts are pinned to a SHA, not a branch name, so a push made
#     after the job starts cannot swap the content out from under us.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

# Least privilege for the default GITHUB_TOKEN. The App token below is what
# carries write access, and only where it is explicitly passed.
permissions:
  contents: read

jobs:
  guard:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      # Trusted: base branch content. Everything we EXECUTE comes from here.
      - name: Checkout base (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # Untrusted: PR content. Read and diffed, never executed.
      - name: Checkout PR head (untrusted, data only)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        working-directory: pr
        run: |
          git config user.name "affiliate-autofix[bot]"
          git config user.email "affiliate-autofix[bot]@users.noreply.github.com"

      - name: Fetch base commit into PR checkout
        working-directory: pr
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${{ github.repository }}.git" 2>/dev/null || true
          git fetch --no-tags --depth=1 upstream "$BASE_SHA"

      # --- Allowlist from the BASE checkout (trusted source) ----------------
      - name: Load CODEOWNERS allowlist
        id: codeowners
        run: |
          set -euo pipefail
          CO="base/.github/CODEOWNERS"
          if [ ! -f "$CO" ]; then
            echo "No .github/CODEOWNERS on base branch; allowlist empty."
            echo "users=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CODEOWNERS lines look like: <pattern> @user [@user...]
          # Collect every @handle; drop comments and blank lines.
          ALLOW_USERS=$(grep -vE '^\s*#' "$CO" \
            | tr ' \t' '\n\n' \
            | grep '^@' \
            | sed 's/^@//' \
            | sort -u \
            | tr '\n' ' ' \
            | sed 's/[[:space:]]*$//')
          echo "Allowlist from base CODEOWNERS: $ALLOW_USERS"
          echo "users=$ALLOW_USERS" >> "$GITHUB_OUTPUT"

      - name: Detect CODEOWNERS modifications
        id: codeowners_changed
        working-directory: pr
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- .github/CODEOWNERS || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Block unauthorized CODEOWNERS changes
        if: ${{ steps.codeowners_changed.outputs.changed == 'true' }}
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ALLOW_USERS: ${{ steps.codeowners.outputs.users }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$PR_AUTHOR" = "$REPO_OWNER" ]; then
            echo "Repo owner editing CODEOWNERS; allowed."
            exit 0
          fi
          if echo " $ALLOW_USERS " | grep -qF " $PR_AUTHOR "; then
            echo "Existing CODEOWNER editing CODEOWNERS; allowed."
            exit 0
          fi
          echo "::error::.github/CODEOWNERS is protected. Only existing CODEOWNERS (or the repo owner) may change it."
          exit 1

      # --- Collect changed markdown files -----------------------------------
      - name: Collect changed markdown files
        id: changed
        working-directory: pr
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.md' '*.mdx' '*.markdown' \
            > "$RUNNER_TEMP/changed_md.txt" || true
          echo "Changed markdown files:"
          cat "$RUNNER_TEMP/changed_md.txt" || true
          if [ -s "$RUNNER_TEMP/changed_md.txt" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      # Script comes from ./base (trusted); it only reads and writes markdown in ./pr.
      - name: Autofix West3D + OneTwo3D affiliate links
        if: ${{ steps.changed.outputs.any == 'true' }}
        working-directory: pr
        run: |
          python3 "$GITHUB_WORKSPACE/base/.github/scripts/affiliate_links.py" \
            fix --files "$RUNNER_TEMP/changed_md.txt"

      - name: Commit and push affiliate fixes (same-repo PRs only)
        if: ${{ steps.changed.outputs.any == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: pr
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No autofix changes to commit."
            exit 0
          fi
          git add -A
          git commit -m "chore: auto-add affiliate tags"
          git push origin "HEAD:refs/heads/$HEAD_REF"

      # --- High-level change detection --------------------------------------
      - name: Detect high-level file changes
        id: highlevel
        working-directory: pr
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            -- '.github/workflows/**' \
               '.github/actions/**' \
               '.github/scripts/**' \
            > "$RUNNER_TEMP/highlevel.txt" || true
          echo "High-level changed files:"
          cat "$RUNNER_TEMP/highlevel.txt" || true
          if [ -s "$RUNNER_TEMP/highlevel.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "files<<HIGHLEVEL_EOF"
            cat "$RUNNER_TEMP/highlevel.txt"
            echo "HIGHLEVEL_EOF"
          } >> "$GITHUB_OUTPUT"

      # --- External link change detection (non West3D/OneTwo3D) -------------
      - name: Generate diff for markdown files
        working-directory: pr
        run: |
          git diff "$BASE_SHA" "$HEAD_SHA" -- '*.md' '*.mdx' '*.markdown' > "$RUNNER_TEMP/diff.txt" || true

      - name: Detect non-affiliate external link changes
        id: links
        working-directory: pr
        run: |
          python3 "$GITHUB_WORKSPACE/base/.github/scripts/affiliate_links.py" \
            check --diff "$RUNNER_TEMP/diff.txt" || true

      # --- Gate: allow if PR author is in BASE CODEOWNERS -------------------
      - name: Gate changes (CODEOWNERS bypass)
        id: gate
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ALLOW_USERS: ${{ steps.codeowners.outputs.users }}
          ADDED: ${{ steps.links.outputs.ADDED }}
          REMOVED: ${{ steps.links.outputs.REMOVED }}
          HIGHLEVEL_CHANGED: ${{ steps.highlevel.outputs.changed }}
        run: |
          set -euo pipefail
          NEEDS_REVIEW=false
          if [ -n "${ADDED:-}" ] || [ -n "${REMOVED:-}" ]; then
            NEEDS_REVIEW=true
          fi
          if [ "${HIGHLEVEL_CHANGED:-false}" = "true" ]; then
            NEEDS_REVIEW=true
          fi

          if [ "$NEEDS_REVIEW" = "false" ]; then
            echo "No gated changes detected."
            echo "BLOCK=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Allow if the author is in the trusted allowlist.
          if echo " $ALLOW_USERS " | grep -qF " $PR_AUTHOR "; then
            echo "PR authored by a CODEOWNER; allowing gated changes."
            echo "BLOCK=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "BLOCK=true" >> "$GITHUB_OUTPUT"

      - name: Comment with report (approval required)
        if: ${{ steps.gate.outputs.BLOCK == 'true' }}
        uses: actions/github-script@v7
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ADDED: ${{ steps.links.outputs.ADDED }}
          REMOVED: ${{ steps.links.outputs.REMOVED }}
          HIGHLEVEL_CHANGED: ${{ steps.highlevel.outputs.changed }}
          HIGHLEVEL_FILES: ${{ steps.highlevel.outputs.files }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const author = process.env.PR_AUTHOR;

            const addedRaw = (process.env.ADDED || "").trim();
            const removedRaw = (process.env.REMOVED || "").trim();
            const added = addedRaw ? addedRaw.split(/\s+/).filter(Boolean) : [];
            const removed = removedRaw ? removedRaw.split(/\s+/).filter(Boolean) : [];

            const highlevelChanged = (process.env.HIGHLEVEL_CHANGED || "") === "true";
            const highlevelFilesRaw = (process.env.HIGHLEVEL_FILES || "").trim();
            const highlevelFiles = highlevelFilesRaw ? highlevelFilesRaw.split(/\s+/).filter(Boolean) : [];

            let body = `## 🔒 Approval Required\n`;
            body += `This PR includes changes that require approval by a user listed in \`.github/CODEOWNERS\`.\n\n`;
            body += `**PR author:** @${author}\n\n`;

            if (highlevelChanged) {
              body += `### 🛠 High-level files changed\n`;
              body += (highlevelFiles.length ? highlevelFiles.map(f => `- ${f}`).join("\n") : "- (unknown)") + "\n\n";
            }

            if (added.length || removed.length) {
              body += `### 🔗 External link changes (excluding West3D / OneTwo3D)\n\n`;
              if (added.length) body += "**Added:**\n" + added.map(u => `- ${u}`).join("\n") + "\n\n";
              if (removed.length) body += "**Removed:**\n" + removed.map(u => `- ${u}`).join("\n") + "\n\n";
            }

            body += `Once approved by a CODEOWNER, it can be merged.\n`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
