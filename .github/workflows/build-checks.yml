name: Build and Format Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Stage 1: Check Formatting
  format-check:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint and Prettier
        run: |
          npm install eslint prettier eslint-config-prettier eslint-plugin-prettier --save-dev
          npx eslint --version
          npx prettier --version

      - name: Run ESLint
        run: |
          npx eslint "**/*.js" || echo "Linting issues found. Please fix them."
        continue-on-error: true

      - name: Run Prettier Check
        run: |
          npx prettier --check "**/*.{js,css,md,json}" || echo "Formatting issues found. Please fix them."
        continue-on-error: true

  # Stage 2: Build Validation
  build:
    name: Validate Build
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # git-revision-date-localized reads the full history to work out each
          # page's "last updated" date. A shallow clone makes every page today.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # --strict turns broken internal links, missing nav targets and bad plugin
      # options into build failures. The tree is warning-clean; keep it that way.
      - name: Build MkDocs Site
        run: |
          mkdocs build --strict

  # Deployment is NOT done here. Cloudflare Pages is connected to this
  # repository directly and builds it itself:
  #   production branch: main
  #   build command:     pip install -r requirements.txt && mkdocs build
  #   output directory:  site
  # Pushes to main publish to production; other branches get preview
  # deployments automatically. The old deploy-hook curl step was removed because
  # it duplicated that and required a secret URL to be kept in the workflow.
