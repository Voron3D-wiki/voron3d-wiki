name: Build and Format Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Starlight's `lastUpdated` reads git history to date each page. A
          # shallow clone makes every page look like it changed today.
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `astro check` type-checks content against the Starlight schema and
      # catches broken internal links, missing frontmatter, and bad component
      # props. The tree is clean; keep it that way.
      - name: Check content
        run: npx astro check

      - name: Build site
        run: npm run build

      # Every page pins an explicit `slug` to the URL it served at under MkDocs.
      # Dropping one silently changes a live URL — Starlight would slugify it,
      # turning /printers/2.4/ into /printers/24/. Fail loudly instead.
      - name: Verify every page pins a slug
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r f; do
            [ "$f" = "src/content/docs/index.mdx" ] && continue
            if ! grep -q '^slug:' "$f"; then
              echo "::error file=$f::missing 'slug:' — this page's URL would change"
              missing=1
            fi
          done < <(find src/content/docs -name '*.mdx')
          exit $missing

  # Deployment is NOT done here. Cloudflare Pages is connected to this
  # repository directly and builds it itself:
  #   production branch: main
  #   build command:     npm ci && npm run build
  #   output directory:  dist
  #   node version:      22 (set NODE_VERSION in the Pages environment)
  # Pushes to main publish to production; other branches get preview
  # deployments automatically.
