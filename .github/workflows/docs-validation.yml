name: Documentation Quality Assurance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      # Pinned to a release tag rather than @master, so an upstream change
      # cannot alter what runs here without a commit to this repo.
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  performance:
    name: Performance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Astro emits optimised WebP for anything referenced from content, so a
      # large file in dist/ is usually an asset in public/ bypassing the
      # pipeline, or a source image referenced by URL instead of import.
      - name: Check for large files
        run: |
          find dist -type f -size +1M | while read -r file; do
            echo "::warning file=$file::larger than 1MB — is it going through Astro's image pipeline?"
          done
