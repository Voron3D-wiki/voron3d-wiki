site_name: Voron3D Wiki
site_url: https://voron3d.wiki

theme:
  favicon: assets/vdesignplainlorig.png
  logo: assets/VoronLogo.png
  name: material
  # Required for overrides/main.html to be rendered at all. Without this the
  # whole overrides/ directory is silently ignored.
  custom_dir: overrides
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate 
    - toc.follow
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.code.select
    - content.code.prompt
    - content.code.highlight_lines
    - content.code.highlight_languages
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: light orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: false
    code: false
  icon:
    repo: fontawesome/brands/github

exclude_docs: |
  tools/
  _templates/

extra_css:
  - stylesheets/extra.css

# Every content page lives at <name>/index.md so its images can sit in the same
# folder. Keep new entries in that form.
nav:
  - Home: index.md
  - Printers:
      - overview: printers/index.md
      - Voron V0:
          - overview: printers/v0/index.md
          - V0.2 BOM: printers/v0/bom/index.md
      - Voron Switchwire: printers/switchwire/index.md
      - Voron Trident: printers/trident/index.md
      - Voron V2.4:
          - overview: printers/2.4/index.md
          - BOM - 300mm: printers/2.4/BOM-300/index.md
          - BOM - 350mm: printers/2.4/BOM-350/index.md
      - Legacy Voron Printers:
          - overview: printers/legacy/index.md
          - Voron V1.6: printers/legacy/v1-6/index.md
          - Voron V1.8: printers/legacy/v1-8/index.md
      - DoomCube:
          - overview: printers/DoomCube/index.md
          - Tri Zero: printers/DoomCube/TriZero/index.md
  - Software:
      - overview: software/index.md
      - Klipper: software/klipper/index.md
      - Klipper Config Help: software/klipper-config-help/index.md
      - Klipper Macros: software/klipper-macros/index.md
  - Electronics:
      - overview: electronics/index.md
      - Motherboards:
          - overview: electronics/mcu/index.md
          - BTT SKR Series: electronics/mcu/btt-skr/index.md
          - Mellow Fly: electronics/mcu/mellow-fly/index.md
          - MKS: electronics/mcu/mks/index.md
          - Octopus: electronics/mcu/octopus/index.md
      - RP2040 Info: electronics/rp2040/index.md
      - Fans: electronics/fans/index.md
      - Connectors: electronics/connectors/index.md
      - Wiring: electronics/wiring/index.md
      - Power Supplies: electronics/power-supplies/index.md
      - Stepper Motors:
          - overview: electronics/stepper-motor/index.md
          - Stepper Motor Database: electronics/stepper-motor/database/index.md
      - Safety: electronics/safety/index.md
  - Printhead:
      - overview: printhead/index.md
      - Hotends:
          - overview: printhead/hotends/index.md
          - DropEffect NExt G: printhead/hotends/dropeffect-nextg/index.md
          - E3D Revo Voron: printhead/hotends/e3d-revo/index.md
          - E3D V6: printhead/hotends/e3d-v6/index.md
          - Phaetus Dragon: printhead/hotends/phaetus-dragon/index.md
          - Phaetus Rapido: printhead/hotends/phaetus-rapido/index.md
      - Nozzles: printhead/nozzle/index.md
      - Extruders:
          - overview: printhead/extruders/index.md
      - Stealthburner: printhead/stealthburner/index.md
      - Toolhead Boards:
          - overview: printhead/toolhead-boards/index.md
          - MKS-THR: printhead/toolhead-boards/mks-thr/index.md
          - FLY-SHT: printhead/toolhead-boards/FLY-SHT/index.md
          - FLY-SB2040: printhead/toolhead-boards/FLY-SB2040/index.md
          - BTT-EBB-Gen1: printhead/toolhead-boards/BTT-EBB-Gen1/index.md
          - BTT-EBB-Gen2: printhead/toolhead-boards/BTT-EBB-Gen2/index.md
          - LDO Orbitool 3: printhead/toolhead-boards/ldo-orbitool-3/index.md
          - LDO Orbitool O2: printhead/toolhead-boards/ldo-orbitool-o2/index.md
  - Filament:
      - overview: filament/index.md
      - Filament Guide: filament/filament-guide/index.md
  - Bed Leveling:
      - overview: bedleveling/index.md
      - Beacon: bedleveling/beacon/index.md
      - Cartographer: bedleveling/cartographer/index.md
      - Eddy Coil: bedleveling/eddy-coil/index.md
      - Eddy: bedleveling/eddy/index.md
  - Multi-Material units:
      - overview: MMUs/index.md
      - ERCF v1/v2: MMUs/ERCF/index.md
      - Tradrack: MMUs/tradrack/index.md
      - BoxTurtle: MMUs/BoxTurtle/index.md
      - PICO-MMU: MMUs/PICO-MMU/index.md
      - BTT-MMU: MMUs/BTT-MMU/index.md
      - Anycubic-MMU: MMUs/Anycubic-MMU/index.md
      - Prusa-MMU: MMUs/Pursa-MMU/index.md
  - Guides:
      - overview: guides/index.md
  # policies/index.md is intentionally not in the nav - it is reached from the
  # footer link and from the affiliate disclosure on individual pages.

plugins:
  - mkdocs-breadcrumbs-plugin:
      delimiter: " / "
      additional_index_folders:
        - temp_dir
      use_page_titles: false
      generate_home_index: false
      home_text: "Home"
      exclude_paths:
        - "assets"
        - "javascripts"
        - "mkdocs"
        - "_templates"
        - "tools"
        - "stylesheets"
        - "docs"
        - "overrides"
        - "site"
        - "docs/javascripts/**"
        - "overrides"
        - "vscode"
        - "pytest_cache"
        - ".github"
  - include-markdown
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags
  - macros
  - table-reader
  - glightbox
  - git-revision-date-localized:
      type: datetime
      timezone: UTC
      locale: en
markdown_extensions:
  - tables
  - attr_list
  - footnotes
  - md_in_html
  - markdown.extensions.attr_list
  - markdown.extensions.toc:
      permalink: true
      toc_depth: 3
  - markdown.extensions.extra
  - markdown.extensions.admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      # custom_fences:
      #   - name: mermaid
      #     class: mermaid
      #     format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption

  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

# Analytics is NOT configured here. The gtag.js library and the `config` call
# live in overrides/main.html so we can set url_passthrough/linker, which the
# Material provider does not expose and which are what kept affiliate URLs
# getting rewritten. Custom events are in docs/javascripts/analytics.js.
# Do not add an `analytics:` block below — it would load a second GA integration
# and double-count every page view.
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/voron3d-wiki
    - icon: fontawesome/brands/discord
      link: https://discord.gg/voron
  footer:
    - text: Policies
      link: policies/index.md

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
  - javascripts/analytics.js
  - javascripts/external-links.js

